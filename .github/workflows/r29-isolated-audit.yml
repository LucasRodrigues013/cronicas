name: WORLDROOT isolated R29 live audit
on:
  push:
    branches: ['worldroot/audit-r29-live-100']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '25f76354b059a20b2e26c741bf47227a5feb9582'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only live corpus and hypothetical microepisode audit
        run: PYTHONPATH=. python -u audit/run_r29.py
