name: WORLDROOT OMEGA-008 C semantic receipt
on:
  pull_request:
    paths:
      - 'worldroot/omega_semantic_receipt.py'
      - 'tests/test_omega_semantic_receipt.py'
      - 'audit/omega008-c/**'
      - 'docs/omega008-c-checkpoint.json'
      - '.github/workflows/omega-semantic-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate controller receipt and prior anchors
        run: |
          python -m unittest discover -s tests -p test_omega_semantic_receipt.py -v
          python -m worldroot.omega_semantic_receipt --archive-root archive
      - name: Original archive unchanged
        if: always()
        run: test -z "$(git -C archive status --porcelain)"
