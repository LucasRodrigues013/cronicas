name: WORLDROOT r8 - GitHub-only durable canon cycle (no OIDC)

on:
  push:
    branches: [story-archive]
    paths:
      - 'canon/BOOTSTRAP_REQUEST.json'
      - 'choices/*/option-*.json'
      - 'canon/BOOK_END_REQUEST.json'

concurrency:
  group: worldroot-canon-github-only
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout audited r12 engine at immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e5535600950000403103945f6b0deaf4f79ed500
          path: engine
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify regression suite including SQLite replay
        env:
          PYTHONPATH: engine
        run: timeout 90s python -m unittest discover -s engine/tests -q
      - name: Report read-only gate
        run: echo 'Engine regression passed; no author choice/canon written in preflight.'

  close-or-bootstrap:
    needs: preflight
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout audited r12 engine (never execute archive code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e5535600950000403103945f6b0deaf4f79ed500
          path: engine
          persist-credentials: false
      - name: Checkout latest private data branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Block Livre VI promotion without recovered original message bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("archive")
          gate = root / "editorial/recovery/LVI-D538-D539-LITERAL-RECOVERY-GATE-20261119.json"
          if not gate.is_file():
              raise SystemExit("WORLDROOT BLOCKED: missing D538-D539 recovery gate")
          data = json.loads(gate.read_text(encoding="utf-8"))
          if data.get("recovery_state") != "RECUPERADO_COM_HASH_EVENTOS_E_CONTINUIDADE":
              raise SystemExit("WORLDROOT BLOCKED: original D538-D539 messages are not fully verified")
          for episode in data["episodes"]:
              eid = episode["id"]
              if not (episode.get("source_integral_verified") is True and
                      episode.get("events_verified") is True and
                      isinstance(episode.get("source_sha256"), str)):
                  raise SystemExit("WORLDROOT BLOCKED: episode has not passed readback: " + eid)
              original = (root / "editorial/recovery/originals" / (eid + ".txt"))
              archived = root / "episodes" / eid / "draft/narrativa_integral.md"
              manifest = root / "episodes" / eid / "draft/manifesto_imutavel.json"
              proof = root / "episodes" / eid / "draft/source_proof.json"
              review = root / "episodes" / eid / "review/continuity_review.json"
              if not all(p.is_file() for p in (original, archived, manifest, proof, review)):
                  raise SystemExit("WORLDROOT BLOCKED: missing external source or package artifact: " + eid)
              source = original.read_bytes()
              if (source != archived.read_bytes() or
                  hashlib.sha256(source).hexdigest() != episode["source_sha256"]):
                  raise SystemExit("WORLDROOT BLOCKED: original chat source differs: " + eid)
          # Protect EVERY subsequent Livro VI draft, not merely the three recovery episodes.
          for folder in sorted((root / "episodes").glob("LVI-*/draft")):
              eid = folder.parent.name
              if eid == "LVI-C01-PI-D538-AUTHOR-SOURCE":  # rejected r17, audit only
                  continue
              original = root / "editorial/recovery/originals" / (eid + ".txt")
              archived = folder / "narrativa_integral.md"
              proof = folder / "source_proof.json"
              manifest = folder / "manifesto_imutavel.json"
              events_file = folder / "eventos_e_consequencias.json"
              review_file = folder.parent / "review/continuity_review.json"
              if not all(p.is_file() for p in (original, archived, proof, manifest, events_file, review_file)):
                  raise SystemExit("WORLDROOT BLOCKED: incomplete literal package: " + eid)
              source = original.read_bytes()
              text = source.decode("utf-8")
              sha = hashlib.sha256(source).hexdigest()
              evidence = json.loads(proof.read_text(encoding="utf-8"))
              record = json.loads(manifest.read_text(encoding="utf-8"))
              review = json.loads(review_file.read_text(encoding="utf-8"))
              events = json.loads(events_file.read_text(encoding="utf-8"))
              if (source != archived.read_bytes() or
                  evidence.get("source_sha256") != sha or
                  evidence.get("source_bytes") != len(source) or
                  record.get("original_readback_sha256") != sha or
                  review.get("status") != "REVIEWED_WITH_EVIDENCE" or
                  not isinstance(events, list) or not events or
                  any(not isinstance(e, dict) or
                      not isinstance(e.get("source_anchor"), str) or
                      e["source_anchor"] not in text for e in events)):
                  raise SystemExit("WORLDROOT BLOCKED: missing SHA256/events/character evidence: " + eid)
          # Historical D539 Caedren anomaly must be resolved by author before promotion.
          resolved = root / "editorial/recovery/reconciliations/LVI-C01-PIII-D539-AUTHOR-SOURCE.json"
          if not resolved.is_file():
              raise SystemExit("WORLDROOT BLOCKED: Caedren D539 continuity reconciliation pending")
          decision = json.loads(resolved.read_text(encoding="utf-8"))
          if not (decision.get("status") == "APPROVED_BY_AUTHOR" and
                  decision.get("issue") == "CAEDREN_ROLE_LOCATION" and
                  decision.get("author_decision")):
              raise SystemExit("WORLDROOT BLOCKED: Caedren resolution lacks author approval")
          print("WORLDROOT: recovered source bytes matched for D538-D539; release may proceed to trusted engine gates")
          PY
      - name: Bootstrap D528 or close the one real pending author selection
        shell: bash
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          if test -f archive/canon/BOOK_END_REQUEST.json; then
            # The Livro V author-approved close request stays archived forever.
            # Once HEAD records that closing, future selected Livro VI drafts
            # must use the normal choice-close path, not re-finalize Livro V.
            if python - <<'PY'
          import json
          from pathlib import Path
          root=Path("archive/canon")
          head=json.loads((root/"HEAD.json").read_text(encoding="utf-8"))
          request=json.loads((root/"BOOK_END_REQUEST.json").read_text(encoding="utf-8"))
          assert head.get("episode_id")==request.get("episode_id")
          assert head.get("book_closed") is True
          PY
            then
              python -m worldroot.git_cycle close --archive-root archive
            else
              python -m worldroot.git_cycle finalize-book --archive-root archive
            fi
          elif test -f archive/canon/HEAD.json; then
            python -m worldroot.git_cycle close --archive-root archive
          else
            python -m worldroot.git_cycle bootstrap --archive-root archive
          fi
          python -m worldroot.git_cycle verify --archive-root archive
      - name: Commit HEAD plus SQLite snapshot and immutable journal atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -A canon
          if git -C archive diff --cached --quiet; then
            echo 'Idempotent run: no canonical data has changed.'
            exit 0
          fi
          git -C archive commit -m "canon(worldroot): verified GitHub-only SQLite snapshot and HEAD"
          # Fast-forward push is an atomic remote transaction: never --force.
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
      - name: Explain non-Google scope
        run: |
          echo 'WORLDROOT GitHub-only HEAD and SQLite committed if changed.'
          echo 'Drive, Base Viva and Atlas were NOT changed by this workflow.'
          echo 'The next chapter must be generated and archived through an explicit ChatGPT GitHub connector invocation.'
