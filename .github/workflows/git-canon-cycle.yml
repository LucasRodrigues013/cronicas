name: WORLDROOT r8 - GitHub-only durable canon cycle (no OIDC)

on:
  push:
    branches: [story-archive]
    paths:
      - 'canon/BOOTSTRAP_REQUEST.json'
      - 'choices/*/option-*.json'
      - 'canon/BOOK_END_REQUEST.json'

concurrency:
  group: worldroot-canon-github-only
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout audited r12 engine at immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad2d0517f399e1a7b5dc173aca5397b6ffe955b3
          path: engine
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify regression suite including SQLite replay
        env:
          PYTHONPATH: engine
        run: timeout 90s python -m unittest discover -s engine/tests -q
      - name: Report read-only gate
        run: echo 'Engine regression passed; no author choice/canon written in preflight.'

  close-or-bootstrap:
    needs: preflight
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout audited r12 engine (never execute archive code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ad2d0517f399e1a7b5dc173aca5397b6ffe955b3
          path: engine
          persist-credentials: false
      - name: Checkout latest private data branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Bootstrap D528 or close the one real pending author selection
        shell: bash
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          if test -f archive/canon/BOOK_END_REQUEST.json; then
            # The Livro V author-approved close request stays archived forever.
            # Once HEAD records that closing, future selected Livro VI drafts
            # must use the normal choice-close path, not re-finalize Livro V.
            if python - <<'PY'
          import json
          from pathlib import Path
          root=Path("archive/canon")
          head=json.loads((root/"HEAD.json").read_text(encoding="utf-8"))
          request=json.loads((root/"BOOK_END_REQUEST.json").read_text(encoding="utf-8"))
          assert head.get("episode_id")==request.get("episode_id")
          assert head.get("book_closed") is True
          PY
            then
              python -m worldroot.git_cycle close --archive-root archive
            else
              python -m worldroot.git_cycle finalize-book --archive-root archive
            fi
          elif test -f archive/canon/HEAD.json; then
            python -m worldroot.git_cycle close --archive-root archive
          else
            python -m worldroot.git_cycle bootstrap --archive-root archive
          fi
          python -m worldroot.git_cycle verify --archive-root archive
      - name: Commit HEAD plus SQLite snapshot and immutable journal atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -A canon
          if git -C archive diff --cached --quiet; then
            echo 'Idempotent run: no canonical data has changed.'
            exit 0
          fi
          git -C archive commit -m "canon(worldroot): verified GitHub-only SQLite snapshot and HEAD"
          # Fast-forward push is an atomic remote transaction: never --force.
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
      - name: Explain non-Google scope
        run: |
          echo 'WORLDROOT GitHub-only HEAD and SQLite committed if changed.'
          echo 'Drive, Base Viva and Atlas were NOT changed by this workflow.'
          echo 'The next chapter must be generated and archived through an explicit ChatGPT GitHub connector invocation.'
