name: WORLDROOT · Arquivo de episódios (integridade)

on:
  push:
    branches: [story-archive]
    paths:
      - 'episodes/**/draft/manifesto_imutavel.json'
      - '.github/workflows/episode-archive-qa.yml'
      - 'tools/validate_episode_archive.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldroot-story-archive-integrity
  cancel-in-progress: false

jobs:
  validate-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private story archive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run synthetic integrity regression tests
        run: python -m unittest discover -s tools -p 'test_archive_validator.py' -v
      - name: Verify literal text, 5 choices, sidecars and SHA256
        run: python tools/validate_episode_archive.py --root .
      - name: Explain scope
        run: |
          echo 'Passed: GitHub archived-package integrity only.'
          echo 'Not run: Google Drive sync, BASE/ATLAS changes, or HEAD publication.'
