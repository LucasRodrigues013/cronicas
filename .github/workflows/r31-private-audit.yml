name: WORLDROOT R31 private recovery audit
on:
  push:
    branches: ['worldroot/r31-deep-recovery']
  pull_request:
    branches: ['worldroot/audit-r30-live-100']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '497260befd3f0fee49e738b5cf4ee1d71c434af9'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full regression suite
        run: python -m unittest discover -s tests
      - name: Full historical index and retrieval evaluation
        env:
          R31_DB_PATH: ${{ runner.temp }}/r31-private/r31.sqlite
        run: PYTHONPATH=. python -u audit/run_r31.py
      - name: Retain private verified projection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r31-private-sqlite
          path: ${{ runner.temp }}/r31-private/r31.sqlite
          retention-days: 7
          if-no-files-found: error
      - name: Preserve R30 behavior on original corpus
        run: PYTHONPATH=. python -u audit/run_r30.py
      - name: Install local semantic dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: R32 structured and dense memory audit
        env:
          R31_DB_PATH: ${{ runner.temp }}/r31-private/r31.sqlite
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: PYTHONPATH=. python -u audit/run_r32.py
      - name: Retain private graph and vector index
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r32-private-memory
          path: |
            ${{ runner.temp }}/r31-private/r32-graph.sqlite
            ${{ runner.temp }}/r31-private/r32-lsa/
          retention-days: 7
          if-no-files-found: error
