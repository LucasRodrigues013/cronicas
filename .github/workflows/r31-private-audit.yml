name: WORLDROOT R31 private recovery audit
on:
  push:
    branches: ['worldroot/r31-deep-recovery']
  pull_request:
    branches: ['worldroot/audit-r30-live-100']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '497260befd3f0fee49e738b5cf4ee1d71c434af9'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full regression suite
        run: python -m unittest discover -s tests
      - name: Full historical index and retrieval evaluation
        run: PYTHONPATH=. python -u audit/run_r31.py
      - name: Preserve R30 behavior on original corpus
        run: PYTHONPATH=. python -u audit/run_r30.py
