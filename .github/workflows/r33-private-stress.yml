name: WORLDROOT R33 stress and reliability
on:
  push:
    branches: ['worldroot/r31-deep-recovery']
    paths: ['worldroot/**','tests/**','audit/**','.github/workflows/r33-private-stress.yml']
  pull_request:
    branches: ['worldroot/audit-r30-live-100']
permissions:
  contents: read
concurrency:
  group: r33-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R31_DB_PATH: ${{ runner.temp }}/r33-private/r31.sqlite
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '497260befd3f0fee49e738b5cf4ee1d71c434af9'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Full regression suite
        run: python -m unittest discover -s tests
      - name: Install pinned local dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Build historical projection
        run: |
          mkdir -p "$(dirname "$R31_DB_PATH")"
          python -m worldroot.deep_recovery --archive-root archive --db "$R31_DB_PATH" build
      - name: Build verified vectors
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from worldroot.semantic_memory import DenseIndex
          db=Path(os.environ["R31_DB_PATH"])
          DenseIndex(db).save_lsa(db.parent/"r32-lsa")
          PY
      - name: Maximum configured load and fault tests
        run: PYTHONPATH=. python -u audit/run_r33.py
      - name: Preserve legacy runtime
        run: PYTHONPATH=. python -u audit/run_r30.py
