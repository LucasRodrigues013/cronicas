name: WORLDROOT r16 - Verified derived context repair before Book VI

on:
  push:
    branches: [story-archive]
    paths:
      - 'editorial/transition-checks/*.json'

concurrency:
  group: worldroot-canon-github-only
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  repair-derived-context:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout audited r16 engine at fixed SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0f0a6ca109374e21d094e4412031486158b2f99a
          path: engine
          persist-credentials: false
      - name: Checkout private immutable sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Regression tests of audited implementation
        env:
          PYTHONPATH: engine
        run: timeout 90s python -m unittest discover -s engine/tests -q
      - name: Verify private source-anchored semantic bridge and regenerate CONTEXT only
        env:
          PYTHONPATH: engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from worldroot.git_cycle import load, verify_db, write_context, sha, canonical
          from worldroot.transition_baseline import inspect_transition_baseline

          root = Path("archive")
          check = load(root / "editorial" / "transition-checks" / "r16-closed-book.json")
          head = load(root / "canon" / "HEAD.json")
          if check.get("schema") != "worldroot-semantic-repair-request-v1":
              raise SystemExit("Unrecognized semantic repair request")
          guard = check.get("head_guard") or {}
          for key in ("episode_id", "sequence", "book", "book_closed", "source_sha256"):
              if guard.get(key) != head.get(key):
                  raise SystemExit("HEAD moved or differs from authorized semantic repair")
          if head.get("book") != "Livro V" or head.get("book_closed") is not True:
              raise SystemExit("Closed Livro V required; never start a new book here")
          baseline = load(root / "editorial" / "transitions" / "lv-to-lvi-semantic-baseline.json")
          verify_db(root, head)
          protected = [root / "canon" / "HEAD.json", root / "canon" / "state.sqlite"]
          for directory in (
              root / "canon" / "episodes", root / "choices", root / "episodes"
          ):
              protected += [p for p in directory.rglob("*") if p.is_file() and not p.is_symlink()]
          protected = sorted(set(protected))
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          before = {str(p): digest(p) for p in protected}
          report = inspect_transition_baseline(root, baseline)
          if report.get("claims_verified") != 13 or report.get("next_book_started") is not False:
              raise SystemExit("Transition claims incomplete or unexpected book mutation")
          context = write_context(root, head)
          if context["head"].get("book_closed") is not True:
              raise SystemExit("Derived CONTEXT contradicts HEAD")
          if context["head_sha256"] != sha(canonical(head)):
              raise SystemExit("Derived context HEAD digest mismatch")
          assumptions = context["prohibited_assumptions"]
          if not any("Livro V is canonically CLOSED" in s for s in assumptions):
              raise SystemExit("Closed-book guidance absent")
          if any("Livro V remains open" in s for s in assumptions):
              raise SystemExit("Obsolete open-book instruction found")
          if context["editorial_only_knowledge_excluded"] < 1:
              raise SystemExit("Expected backstage editorial knowledge not excluded")
          if any(x["visibility"] == "BASTIDORES"
                 for l in context["explicit_character_knowledge"].values() for x in l):
              raise SystemExit("Backstage knowledge exposed to characters")
          if any(x["visibility"] == "BASTIDORES" for x in context["recent_narrated_events"]):
              raise SystemExit("Backstage event exposed as character-view narrated")
          after = {str(p): digest(p) for p in protected}
          if before != after:
              raise SystemExit("Immutable canon, SQLite, narrative or choices mutated")
          print(json.dumps({
              "result": "DERIVED_CONTEXT_REBUILT_SOURCE_VERIFIED",
              "head": head["episode_id"], "sequence": head["sequence"],
              "book_closed": True, "source_anchored_claims": report["claims_verified"],
              "excluded_backstage_knowledge": context["editorial_only_knowledge_excluded"],
              "protected_files_unchanged": len(before),
              "new_book_started": False, "drive_changed": False
          }, sort_keys=True))
          PY
      - name: Commit CONTEXT.json only; never update HEAD, SQLite, stories or choices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add canon/CONTEXT.json
          if git -C archive diff --cached --quiet; then
            echo 'Derived CONTEXT already correct; no mutation.'
            exit 0
          fi
          git -C archive commit -m "fix(worldroot): regenerate semantic CONTEXT from closed-book HEAD only"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
