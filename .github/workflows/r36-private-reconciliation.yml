name: R36 private historical reconciliation
on:
  push:
    branches: ['worldroot/r36-unified-living-engine']
    paths: ['worldroot/r36_reconciliation.py','worldroot/r36_contextual.py','tests/test_r36_contextual.py','tests/test_r36_link_audit.py','worldroot/semantic_local.py','worldroot/semantic_queue.py','tests/test_semantic_queue.py','audit/run_r36_reconciliation.py','tests/test_r36_reconciliation.py','.github/workflows/r36-private-reconciliation.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '34987b0771ec961b4a1c0c6cf203843b113dc000'
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'bbda32f2d060a188a727b88f44346832f5ce32a4'
          path: ledger
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'a41cae7aa8f51148e24cdce59da9256d8d502826'
          path: editorial-review
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: All regression tests
        run: python -m unittest discover -s tests -q
      - name: Check independent local executor availability (no inference)
        run: python -c 'import json; from worldroot.semantic_local import availability; print(json.dumps(availability()))'
      - name: Verify exact historical sources and reconcile event candidates
        run: |
          PYTHONPATH=. python audit/run_r36_reconciliation.py archive ledger/editorial/codex-staging/results/exact-context-ledger-v1 "$RUNNER_TEMP/r36-reconciliation" editorial-review/editorial/codex-staging/r36-aerun-author-review.json
          git -C archive diff --exit-code
          git -C ledger diff --exit-code
          git -C editorial-review diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r36-private-reconciliation-staging
          path: ${{ runner.temp }}/r36-reconciliation/
          retention-days: 7
          if-no-files-found: error
