name: WORLDROOT public-authorized development homologation
on:
  pull_request:
    paths:
      - 'audit/run_omega_homologation.py'
      - '.github/workflows/omega-homologation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Aggregate read-only development replay
        run: PYTHONPATH=. python -u audit/run_omega_homologation.py --archive-root archive
      - name: Assert original archive checkout unchanged
        if: always()
        run: test -z "$(git -C archive status --porcelain)"
