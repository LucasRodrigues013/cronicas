name: WORLDROOT - Three-cycle fast closure, incremental memory and chapter seal QA

on:
  pull_request:
    branches: [story-archive]
    paths:
      - 'tools/worldroot_transition.py'
      - 'tools/worldroot_memory_delta.py'
      - 'tools/worldroot_voice_audit.py'
      - 'tools/worldroot_chapter_seal.py'
      - 'tools/test_worldroot_three_cycles.py'
      - 'tools/test_private_git_readback.py'
      - 'tools/github_chapter_publisher.py'
      - '.github/workflows/git-canon-cycle.yml'
      - '.github/workflows/worldroot-draft-inbox.yml'
      - '.github/workflows/worldroot-three-cycle-qa.yml'
      - '.github/workflows/worldroot-three-cycle-bootstrap.yml'
      - 'docs/WORLDROOT-THREE-CYCLES-v1.md'
  push:
    branches: [story-archive, feature/worldroot-three-cycles-fast-consistent-20261119]
    paths:
      - 'tools/worldroot_transition.py'
      - 'tools/worldroot_memory_delta.py'
      - 'tools/worldroot_voice_audit.py'
      - 'tools/worldroot_chapter_seal.py'
      - 'tools/test_worldroot_three_cycles.py'
      - 'tools/test_private_git_readback.py'
      - '.github/workflows/worldroot-three-cycle-qa.yml'

permissions:
  contents: read

jobs:
  three-cycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private story branch or PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned verified WORLDROOT main engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 06ee3b5b56833ad48f6e90badb94c5a6d6236284
          path: engine
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and independently check three synthetic cycles
        run: |
          set -euo pipefail
          python -m py_compile tools/worldroot_transition.py tools/worldroot_memory_delta.py tools/worldroot_voice_audit.py tools/worldroot_chapter_seal.py
          python -m unittest discover -s tools -p 'test_worldroot_three_cycles.py' -v
          python -m unittest discover -s tools -p 'test_private_git_readback.py' -v
          python -m unittest discover -s tools -p 'test_github_chapter_publisher.py' -v
          python -m unittest discover -s tools -p 'test_lvi_predelivery.py' -v
      - name: Check real D538–D540 source and the ratified Livro VI canonical journal
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          python tools/verify_lvi_original.py --root . --require-all
          python -m worldroot.git_cycle verify --archive-root .
      - name: Real read-only tests (NO invented choice or story mutation)
        run: |
          set -euo pipefail
          python tools/worldroot_transition.py --archive-root . --episode-id LVI-C01-PIV-D540-AUTHOR-SOURCE --option 4 --expected-head LVI-C01-PIII-D539-AUTHOR-SOURCE --user-message 'CI_ONLY_NOT_A_REAL_AUTHOR_CHOICE'
          python tools/worldroot_transition.py --archive-root . --episode-id LVI-C01-PIII-D539-AUTHOR-SOURCE --option 4 --expected-head LVI-C01-PIII-D539-AUTHOR-SOURCE --user-message 'CI_ONLY_NOT_A_REAL_AUTHOR_CHOICE'
          python tools/worldroot_memory_delta.py --archive-root . --mode draft --episode-id LVI-C01-PIV-D540-AUTHOR-SOURCE
          python tools/worldroot_memory_delta.py --archive-root . --mode backfill --write
          python tools/worldroot_memory_delta.py --archive-root . --mode resume --write
          python tools/worldroot_voice_audit.py --archive-root . --episode-id LVI-C01-PIV-D540-AUTHOR-SOURCE --write
          python tools/worldroot_chapter_seal.py --archive-root . --book 'Livro V' --chapter 16
          python tools/worldroot_chapter_seal.py --archive-root . --book 'Livro V' --chapter 16 --check-only
      - name: Confirm source/canon untouched by QA
        run: |
          git diff --exit-code -- canon/ episodes/ history/ choices/ planning/
          echo 'No canon movement, no user-choice creation, no Drive uploads.'
