name: WORLDROOT - Initialize incremental GitHub memory and recoverable state (once)

on:
  push:
    branches: [story-archive]
    paths:
      - 'ops/requests/three-cycle-bootstrap-20261119.json'

permissions:
  contents: write

concurrency:
  group: worldroot-story-write
  cancel-in-progress: false

jobs:
  initialize:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private story archive for the current HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout independently tested main control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 06ee3b5b56833ad48f6e90badb94c5a6d6236284
          path: engine
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prove existing canon journal and source before writing derived memory
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          python -m worldroot.git_cycle verify --archive-root .
          python tools/verify_lvi_original.py --root . --require-all
          python -m unittest discover -s tools -p 'test_worldroot_three_cycles.py' -v
      - name: Backfill only exact reviewed data, voice advisory and current resume snapshot
        run: |
          set -euo pipefail
          python tools/worldroot_memory_delta.py --archive-root . --mode backfill --write
          python tools/worldroot_memory_delta.py --archive-root . --mode resume --write
          python tools/worldroot_voice_audit.py --archive-root . --episode-id LVI-C01-PIV-D540-AUTHOR-SOURCE --write
      - name: Commit derived memory atomically, no canon or episode changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- memory/ ops/RESUME.json editorial/audits/
          if git diff --cached --quiet; then
            echo 'Already bootstrapped: no new derived memory.'
            exit 0
          fi
          test -z "$(git diff --cached --name-only | grep -E '^(canon|episodes|history|choices)/' || true)"
          git commit -m "memory(worldroot): source-verified LVI D538-D540 incremental resume"
          expected="$(git rev-parse HEAD)"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
          git fetch -q origin refs/heads/story-archive:refs/remotes/origin/story-archive
          test "$(git rev-parse refs/remotes/origin/story-archive)" = "$expected"
          echo "SOURCE_BACKED_GITHUB_MEMORY_COMMIT_VERIFIED: $expected"
