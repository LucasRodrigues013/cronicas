name: WORLDROOT r8 - 40-question memory/status audit

on:
  push:
    branches: [story-archive]
    paths:
      - 'audit/qa40/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldroot-memory-status-audit
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout versioned WORLDROOT engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 43c7eb4fb6356d7bff3f2aa9cd81d46df76f172f
          path: engine
          persist-credentials: false
      - name: Checkout private audit evidence and current HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: archive
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate all 40 answer states and source categories against HEAD
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from worldroot.provenance_audit import read_and_verify
          from worldroot.production_roles import verify_roster,route
          root=Path("archive")
          files=sorted((root/"audit"/"qa40").glob("*.json"))
          if len(files)!=1:
              raise SystemExit("Expected exactly one current approved 40-Q review")
          result=read_and_verify(root,files[0])
          assert result["state"] == "STATUS_E_REFERENCIAS_VALIDOS_SEM_CERTIFICACAO_SEMANTICA", result
          assert verify_roster()
          print(json.dumps(result,sort_keys=True,ensure_ascii=False))
          print("One CEO/showrunner + 9 departments / 37 roles; advisory only, not autonomous agents.")
          print("QA verifies source types and canon/draft/planning gates; no semantic truth certified.")
          PY
