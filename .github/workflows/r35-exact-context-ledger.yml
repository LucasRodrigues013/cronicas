name: R35 exact original context ledger
on:
  push:
    branches: [audit/universal-codex-d580]
    paths:
      - 'tools/r35_exact_context_ledger.py'
      - '.github/workflows/r35-exact-context-ledger.yml'
permissions:
  contents: write
concurrency:
  group: r35-exact-context-ledger
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9b34bc491275028fe32fff018b405ab94dcc5c8a
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact original rows, anchors and review routes
        env:
          PYTHONPATH: engine
        run: |
          python archive/tools/r35_exact_context_ledger.py archive
          git -C archive diff --exit-code -- canon episodes choices inbox requests preparations ops history editorial/codex-staging/results/codex.sqlite
      - name: Commit private editorial ledger only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive add -- editorial/codex-staging/results/exact-context-ledger-v1/
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive commit -m "audit: exact 9229 original context rows and structural review routes"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/audit/universal-codex-d580
