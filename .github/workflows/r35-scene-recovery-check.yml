name: R35 private scene and recovery integration
on:
  push:
    branches: [audit/universal-codex-d580]
    paths:
      - 'tools/r35_scene_recovery_check.py'
      - '.github/workflows/r35-scene-recovery-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2ddb6f5707ddd1b8d06f5dfe37d936f04802090c
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 01a44ba424dc3b3434229b0f69c35a066cdf1da7
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source readback, exact identities, bounded scene packet, semantic jobs
        env:
          PYTHONPATH: engine
        run: |
          python audit/tools/r35_scene_recovery_check.py archive audit
          git -C archive diff --exit-code
