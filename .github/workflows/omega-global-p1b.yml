name: OMEGA global P1-B bounded editorial staging audit
on:
  push:
    branches: ['review/omega-turbo-v3']
    paths:
      - 'worldroot/omega_global_p1b.py'
      - 'audit/omega008-c/turbo-v3/global-p1-b-batch-*-sublot-*.json'
      - 'tests/test_omega_global_p1b.py'
      - '.github/workflows/omega-global-p1b.yml'
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: isolated-archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing queue and exchange tests
        run: |
          python -m unittest discover -s tests -p 'test_omega_global_p1b.py' -q
          python -m unittest discover -s tests -p 'test_omega_global_p1a3.py' -q
          python -m unittest discover -s tests -p 'test_semantic_queue.py' -q
          python -m unittest discover -s tests -p 'test_r36_chat_review.py' -q
          python -m unittest discover -s tests -p 'test_r36_reconciliation.py' -q
      - name: Verify P1-A3 seals and P1-B sublot, aggregate only
        run: |
          python -m compileall -q worldroot/omega_global_p1b.py
          python -m worldroot.omega_global_p1b --archive-root isolated-archive
      - name: Verify archive unchanged
        if: always()
        run: test -z "$(git -C isolated-archive status --porcelain)"
      - name: Remove ephemeral archive
        if: always()
        run: rm -rf isolated-archive
