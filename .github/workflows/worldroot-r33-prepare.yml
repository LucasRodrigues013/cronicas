name: WORLDROOT R35 - literary refinement and real corpus regression
on:
  pull_request:
    branches: [story-archive]
    paths:
      - '.github/workflows/worldroot-r33-prepare.yml'
      - '.github/workflows/worldroot-draft-inbox.yml'
      - '.github/workflows/git-canon-cycle.yml'
      - 'ops/ENGINE_PUBLISHING_POLICY.json'
  push:
    branches: [story-archive]
    paths:
      - 'requests/*.json'
  workflow_dispatch:
concurrency:
  group: worldroot-story-write
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2513a9de30790d20aaf5eb830f56f80ac026632
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regression and immutable live state verification
        env:
          PYTHONPATH: engine
        run: |
          python -m unittest discover -s engine/tests -q
          python -m worldroot.git_cycle verify --archive-root archive
          python -m worldroot.r33_runtime --archive-root archive --verify-history
          python - <<'PY'
          from pathlib import Path
          import json
          from worldroot.character_design import load_design,source_bodies,bind_request,verify_binding,candidate_sources
          from worldroot.memory_continuity import review_creation
          root=Path("archive")
          registry=load_design(root)
          assert len(registry["profiles"])==21
          assert sum(p["group"]=="principal" for p in registry["profiles"])==12
          assert sum(p["group"]=="secundária" for p in registry["profiles"])==9
          bodies=source_bodies(registry)
          approved={p["id"] for p in registry["profiles"] if p["age"]["status"]=="AUTHOR_DEFINED"}
          assert approved=={"miren","astra","lyra","thalor-althea","ilva","maelis","lysa","serenna","yra","seris","naira","bressa","adela","serina","orelia","reva","ivena"}
          assert {s.split(":")[1] for s in bodies if s.endswith(":age")}==approved
          assert all("AUTHOR_DESIGN:"+n+":age" not in bodies for n in ("elyrien","avelna","talis","enna"))
          assert "sem sardas" in bodies["AUTHOR_DESIGN:miren:appearance"]
          req={"r34_intent":{"characters":[{"name":"Miren"},{"name":"Lira"},{"name":"Lysa"}]}}
          packet={"character_design":bind_request(root,req)}
          assert {p["id"] for p in verify_binding(root,req,packet)["profiles"]}=={"miren","lyra","lysa"}
          head=json.loads((root/"canon/HEAD.json").read_text())
          requirements=[]
          reviewed={}
          for profile in registry["profiles"]:
              for item in candidate_sources(registry,profile["name"],profile["id"])[0]["sources"]:
                  field=item["source"].rsplit(":",1)[1]
                  rid=profile["id"]+":"+field
                  requirements.append({"id":rid,"domain":"identity","query":profile["name"]+" "+field,"entity":profile["id"],"role":"AuthorDesign","design_field":field,"critical":True})
                  reviewed[rid]={k:item[k] for k in ("source","line_start","line_end","anchor_sha")}
                  reviewed[rid].update(status="REVIEWED_SUPPORTED",claim="Verified author visual design source, not historical assertion.")
          report=review_creation(root,head,requirements,reviewed)
          assert report["verified"]==len(requirements)==38
          print(json.dumps({"female_dossiers":21,"design_evidence_verified":report["verified"],"registry_sha256":registry["sha256"],"focal_binding_verified":True,"canon_changed":False}))
          PY
          python engine/audit/run_r35.py --archive-root archive
          python - <<'PY'
          import json
          from pathlib import Path
          from worldroot.git_cycle import verify_episode
          from worldroot.r35_refinement import rhythm_signals
          root=Path("archive")
          refs=["LVI-C06-PV-D568-AUTHOR-SOURCE","LVI-C07-PIII-D571-AUTHOR-SOURCE","LVI-C08-PV-D578-AUTHOR-SOURCE"]
          out={}
          for ident in refs:
              draft,_=verify_episode(root,ident)
              out[ident]=rhythm_signals(draft.prose)
          assert out[refs[0]]["cadence_review_signal"]=="CONTEXTUAL_REVIEW"
          assert out[refs[1]]["cadence_review_signal"]=="CONTEXTUAL_REVIEW"
          assert out[refs[2]]["cadence_review_signal"]=="REVIEW_COMPRESSION"
          assert not (root/"episodes/LVI-C09-PI-D579-TESTE-R35").exists()
          assert not (root/"requests/LVI-C09-PI-D579-TESTE-R35.json").exists()
          assert not (root/"inbox/LVI-C09-PI-D579-TESTE-R35.json").exists()
          print(json.dumps({"refinement_read_only":out,"pilot_not_in_production":True},ensure_ascii=False))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          from worldroot.turn_continuity import audit_turn_handoff
          root=Path("archive")
          head=json.loads((root/"canon/HEAD.json").read_text())
          resume=json.loads((root/"ops/RESUME.json").read_text())
          pending=resume.get("latest_unclosed_draft") or resume["canon_head"]
          result=audit_turn_handoff(root,pending["episode_id"],expected_head_id=head["episode_id"])
          if not result["ready"]:
              raise RuntimeError("Unverified live handoff")
          print("Live archive verified; no new choice or story written.")
          PY
  prepare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/story-archive' && github.actor == 'LucasRodrigues013'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d2513a9de30790d20aaf5eb830f56f80ac026632
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: story-archive
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9f7ef4adc1b73c576e8d5394de1c19772cb592e7'
          path: omega-data
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: fc-baseline
          persist-credentials: false
      - name: Reconstruct verified editorial locator pack (ephemeral only)
        run: |
          cd omega-data
          python -m worldroot.omega_operational_export --archive-root ../fc-baseline --output "$RUNNER_TEMP/fc-index.json"
      - name: Prepare exactly one genuine persisted request
        env:
          PYTHONPATH: engine
          WORLDROOT_FC_INDEX: ${{ runner.temp }}/fc-index.json
        run: |
          python - <<'PY'
          from pathlib import Path
          from worldroot.r33_runtime import prepare_from_request,read
          root=Path("archive")
          pending=[p for p in sorted((root/"requests").glob("*.json")) if not (root/"preparations"/p.name).is_file()]
          if len(pending)>1:
              raise RuntimeError("Multiple unprepared requests; fail closed")
          if not pending:
              print("No new request; no write.")
          else:
              request=read(pending[0])
              if "r34_intent" not in request or "r35_plan" not in request or "refinement" not in request["r35_plan"]:
                  raise RuntimeError("R35 requires independent intent, longform plan and literary refinement before preparation")
              print(prepare_from_request(root,request))
          PY
      - name: Publish preparations only and verify remote commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d archive/preparations ]; then exit 0; fi
          git -C archive add -- preparations/
          if git -C archive diff --cached --quiet; then exit 0; fi
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive commit -m "worldroot: immutable R33 preparation"
          expected_sha="$(git -C archive rev-parse HEAD)"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch -q origin refs/heads/story-archive:refs/remotes/origin/story-archive
          unset auth_header
          test "$(git -C archive rev-parse refs/remotes/origin/story-archive)" = "$expected_sha"
          echo "R33_PREPARATION_REMOTE_READBACK_VERIFIED: $expected_sha"
