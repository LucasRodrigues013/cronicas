name: OMEGA final convergence FC-02
on:
  push:
    branches: ['review/omega-turbo-v3']
    paths:
      - 'worldroot/omega_final_runtime.py'
      - 'worldroot/scene_context.py'
      - '.github/workflows/omega-final-runtime.yml'
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: isolated-archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing regression suite
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q worldroot
      - name: Native source and preparation bridge, aggregate only
        run: python -m worldroot.omega_final_runtime --archive-root isolated-archive
      - name: Verify archive unchanged
        if: always()
        run: test -z "$(git -C isolated-archive status --porcelain)"
      - name: Remove ephemeral archive
        if: always()
        run: rm -rf isolated-archive
