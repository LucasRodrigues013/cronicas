name: R36 incremental historical review gate (candidate only)
# Free-only: direct local Python/Git execution is the primary path.
# Optional manual runner only; never dispatch a hosted runner or upload artifacts.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/review/r36-b006-native-gate'
    runs-on: [self-hosted, linux, x64, worldroot-free-local]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          persist-credentials: false
      - name: Resolve and validate pinned request
        id: pins
        run: |
          python3.12 - <<'PY'
          import json, os, re
          from pathlib import Path
          d=json.loads(Path("audit/editorial/codex-staging/r36-native-review-request.json").read_text())
          assert d["mode"]=="READ_ONLY_CANDIDATE" and d["production_hold"] is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for k in ("engine","archive","checkpoint"):
                  assert re.fullmatch(r"[0-9a-f]{40}",d[k])
                  f.write(k+"="+d[k]+"\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.engine }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.archive }}
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.checkpoint }}
          path: checkpoint
          persist-credentials: false
      - name: Require preinstalled local Python 3.12 and fresh candidate path
        run: |
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test ! -e "candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Native candidate load_overlay, exact sources, nominal rebind, protected diff and replay
        env:
          PYTHONPATH: engine
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3.12 audit/tools/r36_incremental_historical_review.py audit archive engine checkpoint "candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Full pinned R36 regression suite
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: timeout --signal=TERM --kill-after=5s 120s python3.12 -u -m unittest discover -s tests -v
      - name: Verify read-only checkouts
        run: |
          test -z "$(git -C archive status --porcelain)"
          test -z "$(git -C checkpoint status --porcelain)"
          test -z "$(git -C engine status --porcelain)"
      - name: Verify local candidate receipt (no remote artifact upload)
        run: |
          test -s "candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/native-receipt.json"
          test -s "candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/review-evidence.json"
          echo 'Candidate retained on the authorized local runner; author approval remains required.'
