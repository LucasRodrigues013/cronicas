name: R36 incremental historical review gate (candidate only)
# Public standard runner only; no paid storage, external services, or publication.
on:
  push:
    branches: [review/r36-b007-native-gate]
    paths:
      - '.github/workflows/r36-incremental-historical-review.yml'
      - 'tools/r36_incremental_historical_review.py'
      - 'editorial/codex-staging/r36-native-review-request.json'
      - 'editorial/codex-staging/*native-delta-DRAFT.json'
permissions:
  contents: read
concurrency:
  group: r36-b007-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.private == false && github.ref == 'refs/heads/review/r36-b007-native-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit
          persist-credentials: false
      - name: Resolve and validate pinned request
        id: pins
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          d=json.loads(Path("audit/editorial/codex-staging/r36-native-review-request.json").read_text())
          assert d["mode"]=="READ_ONLY_CANDIDATE" and d["production_hold"] is True
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for k in ("engine","archive","checkpoint"):
                  assert re.fullmatch(r"[0-9a-f]{40}",d[k])
                  f.write(k+"="+d[k]+"\n")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.engine }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.archive }}
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.pins.outputs.checkpoint }}
          path: checkpoint
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native candidate load_overlay, exact sources, nominal rebind, protected diff and replay
        env:
          PYTHONPATH: engine
          PYTHONDONTWRITEBYTECODE: '1'
        run: python audit/tools/r36_incremental_historical_review.py audit archive engine checkpoint candidate
      - name: Full pinned R36 regression suite
        working-directory: engine
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 120s python -u -m unittest discover -s tests -v 2>&1 | tee ../regression.log
      - name: Verify read-only checkouts
        run: |
          test -z "$(git -C audit status --porcelain)"
          test -z "$(git -C archive status --porcelain)"
          test -z "$(git -C checkpoint status --porcelain)"
          test -z "$(git -C engine status --porcelain)"
      - name: Verify candidate hashes and report read-only evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          req=json.loads(Path('audit/editorial/codex-staging/r36-native-review-request.json').read_bytes())
          native=Path('candidate/native-receipt.json')
          review=Path('candidate/review-evidence.json')
          d=json.loads(native.read_bytes())
          assert d['status']=='NATIVE_CANDIDATE_VALIDATED_NOT_APPROVED'
          assert d['approval_required'] is True and d['canon_changed'] is False and d['production_activated'] is False
          assert d['base_archive']==req['archive'] and d['base_checkpoint']==req['checkpoint'] and d['engine']==req['engine']
          assert d['changed_fields']==req['expected_changes'] and d['replay_restore'] is True
          assert len(d['candidate_blobs'])==4
          files=[native,review,Path('regression.log')]
          for path, expected in sorted(d['candidate_blobs'].items()):
              p=Path('candidate/registries')/Path(path).name
              assert subprocess.check_output(['git','hash-object','--no-filters',str(p)],text=True).strip()==expected
              files.append(p)
          log=Path('regression.log').read_text()
          m=re.search(r'^Ran (\d+) tests? in ([\d.]+)s,log,re.M)
          assert m and int(m[1])>0 and log.strip().endswith('OK')
          receipt={'status':'PASS_CANDIDATE_ONLY','tests':int(m[1]),'seconds':float(m[2]),'native_receipt':d,'sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},'production_hold':True,'approval_required':True,'artifact_upload':False}
          line=json.dumps(receipt,ensure_ascii=False,sort_keys=True)
          print('R36_PUBLIC_GATE_RECEIPT '+line)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## R36 B007 — validated candidate only\n\n```json\n'+line+'\n```\n')
          PY
