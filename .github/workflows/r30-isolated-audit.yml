name: WORLDROOT isolated R30 real audit
on:
  push:
    branches: ['worldroot/audit-r30-live-100']
permissions:
  contents: read
jobs:
  audit:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '497260befd3f0fee49e738b5cf4ee1d71c434af9'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Live R30 audit on pinned private source
        run: PYTHONPATH=. python -u audit/run_r30.py
