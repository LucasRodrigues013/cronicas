name: R36 private disposable authority integration
on:
  push:
    branches: ['worldroot/r36-unified-living-engine']
    paths: ['worldroot/**','audit/run_r36_authority.py','.github/workflows/r36-private-authority.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Legacy regression suite
        run: python -m unittest discover -s tests -q
      - name: Private ratification, negative cases and restoration
        run: |
          git -C archive rev-parse HEAD
          PYTHONPATH=. python audit/run_r36_authority.py archive
          git -C archive diff --exit-code
