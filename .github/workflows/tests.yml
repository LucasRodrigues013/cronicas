name: Safe public-code tests
on:
  pull_request:
  push:
    branches: [main, 'worldroot/**']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic offline tests
        run: python -m unittest discover -s tests -v
      - name: Assert no private narrative data in repo
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(private|runtime)/|\.(db|sqlite|sqlite-wal|sqlite-shm|zip|txt)$|\.env' || (echo 'Private file detected' && exit 1)
