name: Safe public-code tests
on:
  pull_request:
  push:
    branches: [main, 'worldroot/**']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run synthetic offline tests
        run: python -m unittest discover -s tests -v
      - name: Static Python compilation
        run: python -m compileall -q worldroot
      - name: Assert no private narrative data in repo
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(private|runtime)/|\.(db|sqlite|sqlite-wal|sqlite-shm|zip|txt)$|\.env' || (echo 'Private file detected' && exit 1)
