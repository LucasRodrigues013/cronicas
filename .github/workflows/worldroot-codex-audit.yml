name: WORLDROOT universal codex staging audit
on:
  pull_request:
    branches: [story-archive]
    paths:
      - 'editorial/codex-staging/**'
      - '.github/workflows/worldroot-codex-audit.yml'
  push:
    branches: [audit/universal-codex-d580]
    paths:
      - 'editorial/codex-staging/**'
      - '.github/workflows/worldroot-codex-audit.yml'
permissions:
  contents: write
concurrency:
  group: worldroot-codex-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/universal-codex-d580' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/universal-codex-d580')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: archive
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d99f240f7e876be052094748879a31f4ccf471c4
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Existing R35 regression and verified archive
        env:
          PYTHONPATH: engine
        run: |
          python -m unittest discover -s engine/tests -q
          python -m worldroot.git_cycle verify --archive-root archive
          python -m worldroot.r33_runtime --archive-root archive --verify-history
      - name: Build universal candidate catalog and test incremental retrieval
        env:
          PYTHONPATH: engine
        run: |
          python archive/editorial/codex-staging/build.py --archive-root archive --engine engine --out archive/editorial/codex-staging/results
          git -C archive diff --exit-code -- canon episodes choices inbox requests preparations ops
      - name: Publish staged results only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive add -- editorial/codex-staging/results/
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive commit -m "audit: verified universal codex candidate projection"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/audit/universal-codex-d580
