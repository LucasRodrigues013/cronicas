name: WORLDROOT OMEGA-008 historical recovery
on:
  pull_request:
    paths:
      - 'worldroot/omega_historical_recovery.py'
      - 'audit/run_omega_historical_recovery.py'
      - '.github/workflows/omega-historical-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover all six source exports and closed episode references
        run: PYTHONPATH=. python -u audit/run_omega_historical_recovery.py --archive-root archive
      - name: Original archive unchanged
        if: always()
        run: test -z "$(git -C archive status --porcelain)"
