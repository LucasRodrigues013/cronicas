name: OMEGA hybrid Book III native staging
on:
  push:
    branches: ['review/omega-turbo-v3']
    paths:
      - 'worldroot/omega_hybrid_receipt.py'
      - 'tests/test_omega_hybrid_receipt.py'
      - 'worldroot/omega_book_iv_handoff.py'
      - 'tests/test_omega_book_iv_handoff.py'
      - '.github/workflows/omega-hybrid-book-iii.yml'
permissions:
  contents: read
jobs:
  native-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synthetic native regression and existing Codex regression
        run: |
          python -m unittest discover -s tests -p 'test_omega_hybrid_receipt.py' -q
          python -m unittest discover -s tests -p 'test_omega_turbo*.py' -q
          python -m unittest discover -s tests -p 'test_live_codex.py' -q
          python -m unittest discover -s tests -p 'test_omega_book_iv_handoff.py' -q
      - name: Public-safe aggregate staging audit (no archive checkout)
        run: python -m worldroot.omega_book_iv_handoff
  literal-private-only:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: isolated-archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m worldroot.omega_book_iv_handoff --archive-root isolated-archive
