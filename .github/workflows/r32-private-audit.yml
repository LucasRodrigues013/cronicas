name: WORLDROOT R32 focused private audit
on:
  push:
    branches: ['worldroot/r36-unified-living-engine']
    paths: ['worldroot/**','tests/**','audit/**','.github/workflows/r32-private-audit.yml']
  pull_request:
    branches: ['worldroot/audit-r30-live-100']
    paths:
      - 'worldroot/memory_graph.py'
      - 'worldroot/semantic_memory.py'
      - 'worldroot/experience_quality.py'
      - 'worldroot/r32_release.py'
      - 'worldroot/draft_inbox.py'
      - 'audit/run_r32.py'
      - 'tests/test_r32_memory.py'
      - '.github/workflows/r32-private-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R31_DB_PATH: ${{ runner.temp }}/r32-private/r31.sqlite
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '497260befd3f0fee49e738b5cf4ee1d71c434af9'
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: All regression tests
        run: python -m unittest discover -s tests
      - name: Install pinned local semantic dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Verify and index all historical sources
        run: |
          mkdir -p "$(dirname "$R31_DB_PATH")"
          python -m worldroot.deep_recovery --archive-root archive --db "$R31_DB_PATH" build
      - name: Structured graph, creation replay and vector audit
        run: PYTHONPATH=. python -u audit/run_r32.py
      - name: Upload private derived projections
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r32-private-complete-projections
          path: ${{ runner.temp }}/r32-private/
          retention-days: 7
          if-no-files-found: error
