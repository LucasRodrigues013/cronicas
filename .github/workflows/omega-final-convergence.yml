name: OMEGA final convergence FC-01
on:
  push:
    branches: ['review/omega-turbo-v3']
    paths:
      - 'worldroot/omega_final_convergence.py'
      - 'tests/test_omega_final_convergence.py'
      - '.github/workflows/omega-final-convergence.yml'
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: isolated-archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Focused regression
        run: |
          python -m unittest discover -s tests -p 'test_omega_final_convergence.py' -q
          python -m unittest discover -s tests -p 'test_live_codex.py' -q
          python -m unittest discover -s tests -p 'test_r36_temporal.py' -q
      - name: Native global map and disposable existing graph, aggregate only
        run: |
          python -m compileall -q worldroot/omega_final_convergence.py
          python -m worldroot.omega_final_convergence --archive-root isolated-archive
      - name: Verify archive unchanged
        if: always()
        run: test -z "$(git -C isolated-archive status --porcelain)"
      - name: Remove ephemeral archive
        if: always()
        run: rm -rf isolated-archive
