name: WORLDROOT - Five-part chapter backup regression (no Drive)

on:
  pull_request:
    branches: [story-archive]
    paths:
      - 'tools/chapter_drive_publisher.py'
      - 'tools/test_chapter_drive_publisher.py'
      - '.github/workflows/worldroot-draft-inbox.yml'
      - '.github/workflows/worldroot-chapter-backup-qa.yml'
  push:
    branches: [story-archive, feature/worldroot-chapter-drive-publisher-v1]
    paths:
      - 'tools/chapter_drive_publisher.py'
      - 'tools/test_chapter_drive_publisher.py'
      - '.github/workflows/worldroot-chapter-backup-qa.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private archive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile publisher and validate synthetic protection cases
        run: |
          python -m py_compile tools/chapter_drive_publisher.py
          python -m unittest discover -s tools -p 'test_chapter_drive_publisher.py' -v
      - name: Verify existing Livro V Chapter 16 from real immutable archive
        run: |
          python tools/chapter_drive_publisher.py --archive-root . --book 'Livro V' --chapter 16 --check-only
      - name: Confirm no Drive or canon access
        run: echo 'Read-only test completed; no OAuth secrets and no story writes.'
