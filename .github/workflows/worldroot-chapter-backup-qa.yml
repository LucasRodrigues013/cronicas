name: WORLDROOT - GitHub-only immutable chapter and literal source QA

on:
  pull_request:
    branches: [story-archive]
    paths:
      - 'tools/chapter_drive_publisher.py'
      - 'tools/github_chapter_publisher.py'
      - 'tools/test_chapter_drive_publisher.py'
      - 'tools/test_github_chapter_publisher.py'
      - '.github/workflows/worldroot-draft-inbox.yml'
      - '.github/workflows/worldroot-chapter-backup-qa.yml'
      - 'docs/WORLDROOT-GITHUB-ONLY-OPERATIONS.md'
  push:
    branches: [story-archive, feature/worldroot-github-only-canon-recovery-20261119]
    paths:
      - 'tools/chapter_drive_publisher.py'
      - 'tools/github_chapter_publisher.py'
      - 'tools/test_chapter_drive_publisher.py'
      - 'tools/test_github_chapter_publisher.py'
      - '.github/workflows/worldroot-chapter-backup-qa.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private archive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile and run GitHub-only chapter integrity regressions
        run: |
          python -m py_compile tools/chapter_drive_publisher.py tools/github_chapter_publisher.py
          python -m unittest discover -s tools -p 'test_chapter_drive_publisher.py' -v
          python -m unittest discover -s tools -p 'test_github_chapter_publisher.py' -v
      - name: Audit real Livro V Chapter 16 without mutation
        run: |
          python tools/github_chapter_publisher.py --archive-root . --book 'Livro V' --chapter 16 --check-only
      - name: Verify all three original exported Livro VI parts and flag continuity
        run: |
          python tools/verify_lvi_original.py --root . --require-all
          python tools/worldroot_canon_selection_guard.py --archive-root .
      - name: No external destinations used
        run: echo 'GitHub only. No OAuth, no Drive API, no HEAD mutation.'
