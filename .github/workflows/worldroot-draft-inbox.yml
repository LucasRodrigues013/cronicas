name: WORLDROOT r8 - Immutable ChatGPT draft inbox + authorial quality gate

on:
  push:
    branches: [story-archive]
    paths:
      - 'inbox/*.json'
      - '.github/workflows/worldroot-draft-inbox.yml'
      - 'ops/ENGINE_PUBLISHING_POLICY.json'
  workflow_dispatch:

concurrency:
  group: worldroot-story-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout audited engine at immutable version, with C02 PV scoped exception
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d810a01724ff3a9ad96ac7a0c5c28474ab6ec15
          path: engine
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test immutable inbox and memory review
        env:
          PYTHONPATH: engine
        run: timeout 90s python -m unittest discover -s engine/tests -q

  archive:
    needs: preflight
    outputs:
      new_episode: ${{ steps.archive_episode.outputs.new_episode }}
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main code (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1d810a01724ff3a9ad96ac7a0c5c28474ab6ec15
          path: engine
          persist-credentials: false
      - name: Checkout private story archive data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify and archive the exact ChatGPT text with SHA256
        id: archive_episode
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from worldroot.draft_inbox import archive_inbox
          from worldroot.delivery_gate import audit_release
          from worldroot.ledger import GateError
          root=Path("archive")
          pending=sorted(
              p for p in (root/"inbox").glob("*.json")
              if not (root/"episodes"/p.stem/"draft"/"manifesto_imutavel.json").exists()
          )
          if len(pending)>1:
              raise GateError("Multiple incomplete drafts detected; fail closed")
          if not pending:
              print("Idempotent inbox run: no unarchived episode.")
              # R27 smoke-check the most recently saved Part even on no-op runs.
              from worldroot.turn_continuity import audit_turn_handoff
              import json
              resume_file=root/"ops"/"RESUME.json"
              if resume_file.is_file():
                  status=json.loads(resume_file.read_text(encoding="utf-8"))
                  latest=status.get("latest_unclosed_draft") or status.get("canon_head")
                  check=audit_turn_handoff(root,latest["episode_id"],
                      expected_head_id=status["canon_head"]["episode_id"])
                  if not check["ready"]:
                      raise GateError("R27 persisted source missing: "+"; ".join(check["errors"])[:240])
                  print("R27_LAST_COMPLETE_ARCHIVE_VERIFIED:", check["story_sha256"])
          else:
              import json
              submitted=json.loads(pending[0].read_text(encoding="utf-8"))
              if submitted.get("metadata",{}).get("worldroot_revision") != 35:
                  raise GateError("R35 declaration required for new inbox; archived episodes remain unchanged")
              receipt=archive_inbox(root,pending[0])
              if pending[0].stem.startswith("LVI-"):
                  import sys
                  sys.path.insert(0, str((root/"tools").resolve()))
                  from lvi_predelivery import prepare_lvi
                  source_proof = prepare_lvi(root, pending[0].stem)
                  print("LVI_PREDELIVERY_PROOF:", source_proof["episode_id"],
                        source_proof["sha256"], source_proof["ui_parity"])
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("new_episode=" + pending[0].stem + "\n")
              gate=audit_release(root,pending[0].stem)
              if not gate["release_allowed"]:
                raise GateError("Reader delivery blocked: " + "; ".join(gate["errors"])[:300])
              print("READER_DELIVERY_GATE_OK:",gate["episode_id"],gate["story_sha256"],
                    "narrative words:",gate["prose_words_approx"])
              # The chat must later re-fetch the exact GitHub source and verify this SHA.
              import json
              reader_dir = root/"delivery"/"reader_receipts"
              reader_dir.mkdir(parents=True, exist_ok=True)
              reader_file = reader_dir/(pending[0].stem+".json")
              reader_receipt = {
                  "schema": "worldroot-reader-release-receipt-v1",
                  "episode_id": pending[0].stem,
                  "status": "ARCHIVED_DRAFT_VERIFIED_FOR_READER",
                  "story_sha256": gate["story_sha256"],
                  "source_path": "episodes/"+pending[0].stem+"/draft/narrativa_integral.md",
                  "canon_promoted": False,
                  "chat_delivery": "CHAT_MUST_FETCH_AND_CHECK_SHA_BEFORE_DISPLAY"
              }
              receipt_bytes = (json.dumps(reader_receipt, ensure_ascii=False, sort_keys=True, separators=(",", ":"))+"\n").encode("utf-8")
              if reader_file.exists() and reader_file.read_bytes() != receipt_bytes:
                  raise GateError("Reader release receipt is immutable and differs")
              reader_file.write_bytes(receipt_bytes)
              import sys
              sys.path.insert(0,str((root/"tools").resolve()))
              from worldroot_memory_delta import draft_delta,resume
              from worldroot_voice_audit import review as review_voice
              incremental=draft_delta(root,pending[0].stem,write=True)
              voice=review_voice(root,pending[0].stem,write=True)
              state=resume(root,write=True)
              # A previous episode cannot be called complete without literal
              # story, immutable SHA, reader receipt and adjacent live HEAD.
              from worldroot.turn_continuity import audit_turn_handoff
              r27=audit_turn_handoff(root,pending[0].stem,
                  expected_head_id=state["canon_head"]["episode_id"])
              if not r27["ready"]:
                  raise GateError("R27 full episode handoff blocked: "+"; ".join(r27["errors"])[:300])
              print("R27_FULL_EPISODE_HANDOFF_OK:",r27["story_sha256"])
              print("SOURCE_ANCHORED_MEMORY:",incremental["episode_id"],incremental["events"])
              print("LUCAS_VOICE_ADVISORY:",voice["status"],voice["current"]["lucas_dialogue_lines"])
              print("RESUME_STATE_SNAPSHOT:",state["canon_head"]["episode_id"])
              print("Immutable draft archived and verified. Events:",receipt["events"],
                    "knowledge:",receipt["knowledge"],"Drive changed:",receipt["drive_changed"])
              # The literary assessment is ADVISORY, not a bureaucratic block.
              focus=receipt.get("story_focus_advisory",{})
              print("Narrative depth advisory:",{
                  "scenes":focus.get("scenes"),
                  "median_scene_words_approx":focus.get("median_scene_words_approx"),
                  "lucas_dialogue_scene_share":focus.get("lucas_dialogue_scene_share"),
                  "notices":focus.get("advisories",[]),
              })
              life=receipt.get("lived_narrative_advisory",{})
              print("Lived narrative editorial review:",{
                  "status":life.get("status"),
                  "days_touched":life.get("days_touched"),
                  "scene_count":life.get("scene_count"),
                  "short_scene_share":life.get("short_scene_share"),
                  "procedural_hits_per_1000_words":life.get("procedural_hits_per_1000_words"),
                  "advisories":life.get("advisories",[]),
              })
              depth=receipt.get("longform_depth",{})
              stage=receipt.get("longform_stage",{})
              print("Narrative only length:",{
                  "prose_words_approx":depth.get("prose_words_approx"),
                  "target_words":depth.get("target_words"),
                  "status":depth.get("status"),
                  "short_scenes":depth.get("very_short_scenes",[]),
              })
              print("Longform continuity receipt:",{
                  "status":stage.get("status"),"stages":stage.get("parts"),
                  "verified":stage.get("verified"),
              })
              days=receipt.get("day_arc_advisory",{})
              print("Lived-day advisory:",{
                  "first":days.get("first"),
                  "last":days.get("last"),
                  "elapsed_minutes":days.get("elapsed_minutes"),
                  "notices":days.get("advisories",[]),
              })
          PY
      - name: Atomically commit all eight private archive sidecars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -A -- episodes/ delivery/reader_receipts/ editorial/recovery/originals/ memory/ editorial/audits/ ops/RESUME.json
          if git -C archive diff --cached --quiet; then
            echo 'No new archive bytes; idempotent recovery.'
            exit 0
          fi
          git -C archive commit -m "archive(worldroot): immutable private episode package and reviewed memory"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          expected_sha="$(git -C archive rev-parse HEAD)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch -q origin refs/heads/story-archive:refs/remotes/origin/story-archive
          unset auth_header
          actual_sha="$(git -C archive rev-parse refs/remotes/origin/story-archive)"
          test "$actual_sha" = "$expected_sha"
          echo "DRAFT_REMOTE_READBACK_SHA_VERIFIED: $actual_sha"
      - name: Explicitly report scope
        run: |
          echo 'Private GitHub narrative archived with literal SHA256 and semantic evidence.'
          echo 'This action does NOT promote canon, update Google Drive or generate prose.'


  chapter-github-publish:
    name: Version complete five-part chapter exclusively in private GitHub
    needs: archive
    if: github.actor == 'LucasRodrigues013' && needs.archive.outputs.new_episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout latest private immutable archive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Synthetic integrity, old rejected draft, immutability and canon-isolation tests
        run: |
          python -m unittest discover -s tools -p 'test_chapter_drive_publisher.py' -v
          python -m unittest discover -s tools -p 'test_github_chapter_publisher.py' -v
      - name: Package newly archived Parte V, otherwise skip without side effects
        env:
          EPISODE_ID: ${{ needs.archive.outputs.new_episode }}
        run: |
          set -euo pipefail
          python tools/github_chapter_publisher.py --archive-root . --episode-id "$EPISODE_ID"
      - name: Commit versioned chapter and verified local receipts to GitHub only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d chapters ]; then git add -A -- chapters/; fi
          if [ -d delivery/github_chapters ]; then git add -A -- delivery/github_chapters/; fi
          if git diff --cached --quiet; then
            echo 'No new complete five-part chapter: no Git change.'
            exit 0
          fi
          git commit -m "chapter(worldroot): immutable GitHub-only five-part chapter package"
          expected_sha="$(git rev-parse HEAD)"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch -q origin refs/heads/story-archive:refs/remotes/origin/story-archive
          unset auth_header
          actual_sha="$(git rev-parse refs/remotes/origin/story-archive)"
          test "$actual_sha" = "$expected_sha"
          echo "GITHUB_CHAPTER_REMOTE_COMMIT_VERIFIED: $actual_sha"
          echo 'Google Drive and canon HEAD were NOT modified.'
