name: WORLDROOT r8 - Immutable ChatGPT draft inbox + authorial quality gate

on:
  push:
    branches: [story-archive]
    paths:
      - 'inbox/*.json'

concurrency:
  group: worldroot-story-draft-inbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout audited engine at immutable version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e5535600950000403103945f6b0deaf4f79ed500
          path: engine
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test immutable inbox and memory review
        env:
          PYTHONPATH: engine
        run: timeout 90s python -m unittest discover -s engine/tests -q

  archive:
    needs: preflight
    outputs:
      new_episode: ${{ steps.archive_episode.outputs.new_episode }}
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main code (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e5535600950000403103945f6b0deaf4f79ed500
          path: engine
          persist-credentials: false
      - name: Checkout private story archive data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify and archive the exact ChatGPT text with SHA256
        id: archive_episode
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from worldroot.draft_inbox import archive_inbox
          from worldroot.delivery_gate import audit_release
          from worldroot.ledger import GateError
          root=Path("archive")
          pending=sorted(
              p for p in (root/"inbox").glob("*.json")
              if not (root/"episodes"/p.stem/"draft"/"manifesto_imutavel.json").exists()
          )
          if len(pending)>1:
              raise GateError("Multiple incomplete drafts detected; fail closed")
          if not pending:
              print("Idempotent inbox run: no unarchived episode.")
          else:
              receipt=archive_inbox(root,pending[0])
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("new_episode=" + pending[0].stem + "\n")
              gate=audit_release(root,pending[0].stem)
              if not gate["release_allowed"]:
                raise GateError("Reader delivery blocked: " + "; ".join(gate["errors"])[:300])
              print("READER_DELIVERY_GATE_OK:",gate["episode_id"],gate["story_sha256"],
                    "narrative words:",gate["prose_words_approx"])
              print("Immutable draft archived and verified. Events:",receipt["events"],
                    "knowledge:",receipt["knowledge"],"Drive changed:",receipt["drive_changed"])
              # The literary assessment is ADVISORY, not a bureaucratic block.
              focus=receipt.get("story_focus_advisory",{})
              print("Narrative depth advisory:",{
                  "scenes":focus.get("scenes"),
                  "median_scene_words_approx":focus.get("median_scene_words_approx"),
                  "lucas_dialogue_scene_share":focus.get("lucas_dialogue_scene_share"),
                  "notices":focus.get("advisories",[]),
              })
              life=receipt.get("lived_narrative_advisory",{})
              print("Lived narrative editorial review:",{
                  "status":life.get("status"),
                  "days_touched":life.get("days_touched"),
                  "scene_count":life.get("scene_count"),
                  "short_scene_share":life.get("short_scene_share"),
                  "procedural_hits_per_1000_words":life.get("procedural_hits_per_1000_words"),
                  "advisories":life.get("advisories",[]),
              })
              depth=receipt.get("longform_depth",{})
              stage=receipt.get("longform_stage",{})
              print("Narrative only length:",{
                  "prose_words_approx":depth.get("prose_words_approx"),
                  "target_words":depth.get("target_words"),
                  "status":depth.get("status"),
                  "short_scenes":depth.get("very_short_scenes",[]),
              })
              print("Longform continuity receipt:",{
                  "status":stage.get("status"),"stages":stage.get("parts"),
                  "verified":stage.get("verified"),
              })
              days=receipt.get("day_arc_advisory",{})
              print("Lived-day advisory:",{
                  "first":days.get("first"),
                  "last":days.get("last"),
                  "elapsed_minutes":days.get("elapsed_minutes"),
                  "notices":days.get("advisories",[]),
              })
          PY
      - name: Atomically commit all eight private archive sidecars
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -A episodes/
          if git -C archive diff --cached --quiet; then
            echo 'No new archive bytes; idempotent recovery.'
            exit 0
          fi
          git -C archive commit -m "archive(worldroot): immutable private episode package and reviewed memory"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C archive -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
      - name: Explicitly report scope
        run: |
          echo 'Private GitHub narrative archived with literal SHA256 and semantic evidence.'
          echo 'This action does NOT promote canon, update Google Drive or generate prose.'

  chapter-drive-backup:
    name: Five-part verified chapter backup to Google Drive
    needs: archive
    if: github.actor == 'LucasRodrigues013' && needs.archive.outputs.new_episode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout current private archive after episode commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test five-part backup integrity and chronology gates
        run: |
          python -m unittest discover -s tools -p 'test_chapter_drive_publisher.py' -v
      - name: Identify newly completed fifth part
        id: probe
        shell: bash
        env:
          EPISODE_ID: ${{ needs.archive.outputs.new_episode }}
        run: |
          set -euo pipefail
          RESULT="$(python tools/chapter_drive_publisher.py --archive-root . --episode-id "$EPISODE_ID" --check-only)"
          echo "$RESULT"
          if [[ "$RESULT" == *"CHAPTER_VERIFIED:"* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Google Drive client libraries
        if: steps.probe.outputs.ready == 'true'
        run: python -m pip install 'google-auth>=2,<3' 'google-api-python-client>=2,<3'
      - name: Upload integral chapter to Drive and verify independent readback
        if: steps.probe.outputs.ready == 'true'
        env:
          EPISODE_ID: ${{ needs.archive.outputs.new_episode }}
          WORLDROOT_GOOGLE_CLIENT_ID: ${{ secrets.WORLDROOT_GOOGLE_CLIENT_ID }}
          WORLDROOT_GOOGLE_CLIENT_SECRET: ${{ secrets.WORLDROOT_GOOGLE_CLIENT_SECRET }}
          WORLDROOT_GOOGLE_REFRESH_TOKEN: ${{ secrets.WORLDROOT_GOOGLE_REFRESH_TOKEN }}
          WORLDROOT_DRIVE_CHAPTER_FOLDER_ID: ${{ secrets.WORLDROOT_DRIVE_CHAPTER_FOLDER_ID }}
        run: |
          set -euo pipefail
          python tools/chapter_drive_publisher.py --archive-root . --episode-id "$EPISODE_ID"
      - name: Commit verified Drive receipt without touching story canon
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- delivery/drive_chapters/
          if git diff --cached --quiet; then
            echo 'Idempotent chapter Drive backup: no receipt change.'
            exit 0
          fi
          git commit -m "backup(worldroot): verified five-part Google Drive chapter receipt"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" push origin HEAD:refs/heads/story-archive
          unset auth_header
          echo 'Drive chapter receipt committed. Canon HEAD and episodes unchanged.'
