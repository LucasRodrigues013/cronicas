name: WORLDROOT R36 convergence configuration readback
on:
  push:
    branches: [story-archive]
    paths:
      - 'ops/ENGINE_PUBLISHING_POLICY.json'
      - '.github/workflows/worldroot-r36-convergence-config.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 'd2513a9de30790d20aaf5eb830f56f80ac026632'
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9f7ef4adc1b73c576e8d5394de1c19772cb592e7'
          path: omega-data
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '9dd632fb0bcd84dfce5b631013fdc67d7492ac5d'
          path: fc-baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Regenerate pinned advisory pack without publishing data
        run: |
          cd omega-data
          python -m worldroot.omega_operational_export --archive-root ../fc-baseline --output "$RUNNER_TEMP/fc-index.json"
      - name: Verify actual active configuration and protected narrative
        env:
          PYTHONPATH: engine
          WORLDROOT_FC_INDEX: ${{ runner.temp }}/fc-index.json
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from worldroot.r33_runtime import read,digest,author_context
          from worldroot.r36_history_advisory import configured,check_binding
          r=Path("archive");b=Path("fc-baseline")
          p=read(r/"ops/ENGINE_PUBLISHING_POLICY.json");c=p["r36_convergence"]
          assert p["engine_code_commit"]==subprocess.check_output(["git","-C","engine","rev-parse","HEAD"],text=True).strip()==c["engine_commit"]
          assert c["omega_export_commit"]==subprocess.check_output(["git","-C","omega-data","rev-parse","HEAD"],text=True).strip()
          for name in ("worldroot-r33-prepare.yml","git-canon-cycle.yml","worldroot-draft-inbox.yml"):
              assert (r/".github/workflows"/name).read_text().count(c["engine_commit"])==2
          for name in ("canon/HEAD.json","canon/state.sqlite","ops/RESUME.json"):
              assert (r/name).read_bytes()==(b/name).read_bytes()
          ident="LVI-C09-PII-D580-AUTHOR-SOURCE"
          req=read(r/"requests"/(ident+".json"));prep=read(r/"preparations"/(ident+".json"))
          assert digest(req)==prep["request_sha256"] and author_context(r,req["head"])==prep["authority"]
          a=configured(r,req);check_binding(req,a)
          assert a["advisory_sha256"]=="8b640db9100bb89fcb999d36947fa3622e3ba4556dd6a8b6349f129c08c74801"
          assert a["locator_count"]==117 and a["critical_without_advisory"]==0
          assert (r/"requests"/(ident+".json")).read_bytes()==(b/"requests"/(ident+".json")).read_bytes()
          assert (r/"preparations"/(ident+".json")).read_bytes()==(b/"preparations"/(ident+".json")).read_bytes()
          print(json.dumps({"status":"R36_ACTIVE_CONFIGURATION_READBACK_PASS","head_day":req["head"]["day"],"sequence":req["head"]["sequence"],"locators":a["locator_count"],"requirements":len(a["requirements"]),"canonical_files_unchanged":True,"choice_executed":False,"narrative_generated":False,"semantic_certification":False},sort_keys=True))
          PY
      - name: Verify no archive modification
        if: always()
        run: test -z "$(git -C archive status --porcelain)"
      - name: Cleanup
        if: always()
        run: rm -rf archive fc-baseline omega-data "$RUNNER_TEMP/fc-index.json"
