name: WORLDROOT r8 - Independent state restore and D529 review audit

on:
  push:
    branches: [story-archive]
    paths:
      - 'audit/requests/*.json'

permissions:
  contents: read

concurrency:
  group: worldroot-independent-state-audit
  cancel-in-progress: false

jobs:
  restore-and-review:
    if: github.actor == 'LucasRodrigues013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable audited engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: cf1d5376196c13dc6962c8c51969d4bdf83e16cf
          path: engine
          persist-credentials: false
      - name: Checkout private story/archive state read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify persistent SQLite original and HEAD
        env:
          PYTHONPATH: engine
        run: python -m worldroot.git_cycle verify --archive-root archive
      - name: Restore SQLite independently from private Git journal
        shell: bash
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          mkdir -p recovery
          cp -a archive/. recovery/
          rm recovery/canon/state.sqlite
          python -m worldroot.git_cycle restore --archive-root recovery
          python -m worldroot.git_cycle verify --archive-root recovery
      - name: Verify actual D529 immutable text, reviewed events, and knowledge
        env:
          PYTHONPATH: engine
        run: |
          python - <<'PY'
          from pathlib import Path
          from worldroot.git_cycle import load,verify_episode,review_deltas,_chronology
          root=Path("archive")
          head=load(root/"canon"/"HEAD.json")
          draft,manifest=verify_episode(root,"LV-C15-PII-D529-AUTHOR-SOURCE")
          _chronology(head,draft.metadata)
          events,knowledge=review_deltas(root,draft.delivery_id,draft)
          assert len(events)==11 and len(knowledge)==6
          print("D529 actual immutable package/review preflight OK: 11 evidence-linked events, 6 temporal knowledge facts.")
          print("No user choice processed; no narrative canon or Google Drive status changed.")
          PY
      - name: Do not expose prose or modify the canonical branch
        run: echo 'Independent read-only disaster recovery completed. Canonical data unchanged.'
