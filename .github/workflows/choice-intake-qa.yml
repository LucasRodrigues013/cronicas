name: WORLDROOT - Author Choice Intake (read-only)

on:
  push:
    branches: [story-archive]
    paths:
      - 'choices/*/option-*.json'

permissions:
  contents: read

concurrency:
  group: worldroot-author-choice-intake
  cancel-in-progress: false

jobs:
  validate-author-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed control plane from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: engine
          persist-credentials: false
      - name: Checkout immutable private archive at triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: archive
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate synthetic choice-intake regression tests
        env:
          PYTHONPATH: engine
        run: python -m unittest discover -s engine/tests -p 'test_choice_intake.py' -q
      - name: Check the immutable archived source and five choices
        run: python archive/tools/validate_episode_archive.py --root archive
      - name: Verify real recorded choice envelope (without modifying canon)
        env:
          PYTHONPATH: engine
        run: python -m worldroot.choice_intake --archive-root archive
      - name: State the limits of this Action
        run: |
          echo 'CHOICE_SHAPE_VALIDATED; actual author identity remains a trusted bridge responsibility.'
          echo 'No Google Drive, Base Viva, Atlas, SQLite canonical commit, or HEAD publication was executed.'
