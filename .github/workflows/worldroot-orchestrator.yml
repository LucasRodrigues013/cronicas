name: WORLDROOT - Control Plane Read-Only Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worldroot/**'
      - 'tests/**'
      - 'docs/operational-deployment-status.md'
      - '.github/workflows/worldroot-orchestrator.yml'

permissions:
  contents: read

concurrency:
  group: worldroot-control-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check tracked public-code paths (aggregate only)
        run: python -m worldroot.public_custody
      - name: Regression tests and syntax
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q worldroot

  verify-story-archive:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read private archive (no write credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: story-archive
          path: archive
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require nonempty immutable episode archive
        shell: bash
        run: |
          test -d archive/episodes
          find archive/episodes -path '*/draft/manifesto_imutavel.json' -type f -print -quit | grep -q .
      - name: Validate source narrative, five choices and SHA256
        run: |
          python -m unittest discover -s archive/tools -p 'test_archive_validator.py' -q
          python archive/tools/validate_episode_archive.py --root archive

  report-gates:
    needs: [validate-engine, verify-story-archive]
    if: always() && needs.validate-engine.result == 'success' && (needs.verify-story-archive.result == 'success' || needs.verify-story-archive.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain verification boundary
        shell: bash
        run: |
          echo 'WORLDROOT code audit passed; archive audit result: ${{ needs.verify-story-archive.result }}.'
          echo 'This job does NOT close an episode, update Drive, promote events, or advance the canonical HEAD.'
          echo 'Production closure remains blocked until OIDC, durable SQLite checkpoint, Base/Atlas readback and editorial approval.'
