name: R36 APEX 9 shadow selection
on:
  push:
    branches: ['review/r36-apex9-semantic']
    paths:
      - 'worldroot/r36_apex_selection.py'
      - 'worldroot/r36_history_advisory.py'
      - 'worldroot/r36_temporal.py'
      - 'worldroot/live_codex.py'
      - 'tests/test_r36_apex_epistemic.py'
      - 'worldroot/r36_adaptive.py'
      - 'tests/test_r36_apex_shadow_contract.py'
      - 'tests/test_r36_apex_selection.py'
      - '.github/workflows/r36-apex-shadow.yml'
permissions:
  contents: read
jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Code regression only (no archive, no private evaluation)
        run: |
          python -m unittest discover -s tests -q
          python -m compileall -q worldroot
